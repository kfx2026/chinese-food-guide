<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Chongqing Test</title></head><body>
<h1>Testing Chongqing Data Loading</h1>
<div id="result"></div>
<script>
async function test() {
  const out = document.getElementById('result');
  try {
    const idx = await fetch('data/index.json').then(r=>r.json());
    out.innerHTML += '<p>index.json loaded: ' + idx.provinces.length + ' provinces</p>';
    
    const cq = idx.provinces.find(p=>p.id==='chongqing');
    out.innerHTML += '<p>Chongqing: status=' + cq.status + ', dish_count=' + cq.dish_count + '</p>';
    
    const data = await fetch('data/provinces/chongqing.json').then(r=>r.json());
    out.innerHTML += '<p>chongqing.json loaded: en entries=' + data.en.length + '</p>';
    
    const dishes = data.en[0].dishes;
    out.innerHTML += '<p>Dishes: ' + dishes.length + '</p><ul>';
    dishes.forEach(d => out.innerHTML += '<li>' + d.name + ' - ' + (d.description||'').substring(0,50) + '...</li>');
    out.innerHTML += '</ul>';
    
    out.innerHTML += '<p style="color:green;font-weight:bold">✅ Chongqing data loading WORKS!</p>';
  } catch(e) {
    out.innerHTML += '<p style="color:red">❌ Error: ' + e.message + '</p>';
  }
}
test();
</script>
</body></html>
